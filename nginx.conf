server {
  # Nginx listens on port 80 by default
  listen 80;

  # Use localhost for development, or your domain for production
  server_name localhost;

  # The root directory containing the built Vite app
  root /usr/share/nginx/html;
  index index.html;

  # Hide the nginx version in response headers
  server_tokens off;

  # Compress text-based assets before sending to the browser
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite outputs hashed, content-addressed filenames into /assets/, so
  # these are safe to cache forever - the filename itself changes if the
  # content does. A missing file here is a genuine 404, never a SPA
  # route, so we don't fall back to index.html like the block below does
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html must always be revalidated with the server before being served
  # from cache, ensuring users get fresh asset references after every deploy
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Handle SPA routing - serve index.html for all other routes so
  # client-side routing works on refresh and direct links. /index.html is
  # the last argument so nginx redirects internally to the location above
  # and applies its no-cache header
  location / {
    try_files $uri /index.html;
  }
}